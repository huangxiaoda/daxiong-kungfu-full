<!DOCTYPE html>

    <style>

        }
        .pricing-card {
            border: 2px solid #ffb300;

        .business-info {

        }
        a {
            color: #ffb300;
            text-decoration: none;
            font-weight: bold;
        }

    <script src="https://cdn.paddle.com/paddle/paddle.js"></script>

<body>
    <h1>大熊学武功 - 永久版定价</h1>
    
    <div class="pricing-card">

   <!-- Paddle 购买按钮 -->
        <button

                color: white;
                border: none;
                padding: 15px 40px;
                font-size: 1.2em;
                border-radius: 8px;
                cursor: pointer;
                margin-top: 20px;
                font-weight: bold;
                transition: all 0.3s ease;
            "
            onmouseover="this.style.transform='scale(1.05)';"
            onmouseout="this.style.transform='scale(1)';"

        <p><strong>联系我们：</strong> lord_huang@nobalead.com</p >

    </div>
     <script>
        // 页面加载完成后初始化Paddle
        document.addEventListener('DOMContentLoaded', function() {
            // 使用您LIVE环境的Client-side Token替换下面的内容
            Paddle.Initialize({
                token: "live_5f9b4d8b6f9009e460043ae527a" // ★ 记得替换!
            });
        });

        // 定义购买函数
        function initiatePurchase() {
            Paddle.Checkout.open({
                product: "pro_01kawh5e7vyxffthrykkjk9p42", // ★ 记得替换!
                successCallback: function(data) {
                    console.log("支付成功!", data);
                    alert("感谢您的购买！您已成功解锁永久版。");
                    // 成功后可以跳转到游戏页面或显示解锁信息
                },
                closeCallback: function(data) {
                    console.log("用户关闭了支付窗口", data);
                }
            });
        }
    </script>
    <p></p >
