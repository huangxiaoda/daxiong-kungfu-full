<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大熊学武功 - 定价</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px;
            text-align: center;
        }
        .pricing-card {
            border: 2px solid #ffb300;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
        }
        .price { 
            font-size: 2em; 
            color: #e65100; 
            font-weight: bold;
        }
        .business-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 25px 0;
            border-left: 4px solid #ffb300;
            font-size: 0.9em;
        }
        a {
            color: #ffb300;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script type="text/javascript"> 
    if (typeof Paddle === 'undefined') {
    console.error('❌ Paddle.js未加载！');
} else {
    console.log('✅ Paddle.js已加载');
    
    try {
        // 1. 设置环境
        Paddle.Environment.set('production');
        console.log('🔄 环境设置为production');
        
        // 2. 初始化
        Paddle.Initialize({
            token: "live_c96499fff8cbcb5eb8eab6964c6",
            eventCallback: function(data) {
                console.log('🔍 Paddle事件:', data.name);
                
                if (data.name === 'checkout.completed') {
                    console.log('💰 支付成功！');
                    localStorage.setItem('daxiong_pro_unlocked', 'true');
                    
                    // 可选：立即隐藏弹窗给用户反馈
                    document.getElementById('purchaseOverlay')?.classList.add('hidden');
                    
                    // 3秒后刷新
                    setTimeout(() => {
                        alert('🎉 购买成功！页面即将刷新。');
                        window.location.reload();
                    }, 3000);
                }
            }
        });
        console.log('✅ Paddle初始化完成');
        
    } catch (error) {
        console.error('❌ Paddle设置失败:', error);
    }
    
    // 3. 环境验证（延迟检查）
    setTimeout(() => {
        const currentEnv = Paddle.Environment?.current;
        console.log('📊 最终环境检查:', currentEnv || 'undefined');
        
        if (!currentEnv) {
            console.warn('⚠️ 环境检测为undefined，但可能仍能工作');
        }
    }, 1000);
}
</head>
<body>
    <h1>大熊学武功 - 永久版定价</h1>
    
    <div class="pricing-card">
        <h2>永久版游戏</h2>
        <p>畅享所有功能，无限次游戏</p >
        <div class="price">¥50.00 | $6.99</div>
        <p>一次性购买，永久有效</p >
        <ul style="text-align: left; display: inline-block;">
            <li>无限游戏次数</li>
            <li>永久免费更新</li>
            <li>支持独立开发者</li>
            <li>全功能解锁</li>
        </ul>
   <!-- Paddle 购买按钮 -->
        <button 
            onclick="initiatePurchase()" 
            style="
                background: linear-gradient(135deg, #ffb300, #e65100);
                color: white;
                border: none;
                padding: 15px 40px;
                font-size: 1.2em;
                border-radius: 8px;
                cursor: pointer;
                margin-top: 20px;
                font-weight: bold;
                transition: all 0.3s ease;
            "
            onmouseover="this.style.transform='scale(1.05)';"
            onmouseout="this.style.transform='scale(1)';"
        >
        🐻 立即购买永久版 - $6.99
        </button>
    </div>

    <div class="business-info">
        <h3>商家信息</h3>
        <p><strong>公司名称：</strong> Shenzhen Niu Baili Investment Development Co., Ltd.</p >
        <p><strong>联系我们：</strong> lord_huang@nobalead.com</p >
        <p><strong>服务条款：</strong> 查看永久版条款</p >
    </div>
      
<script>
// 支付函数 
        function launchPaddleCheckout() {
            const PURCHASE_ITEM = [{
                priceId: "pri_01kawrmv7vcpnxwhsbn3tyf80q",
                quantity: 1
            }];
            Paddle.Checkout.open({
                items: PURCHASE_ITEM
            });
        }
       
    </script>
    <p></p >
</body>
</html>
